name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

      - name: Pytest
        run: pytest -m "not integration and not contract and not eval" --cov=testgen --cov-report=term-missing

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + pip-audit
        run: |
          pip install -e ".[dev]"
          pip install pip-audit

      - name: pip-audit
        run: pip-audit --skip-editable

# Docker build/push steps are added once Dockerfiles exist (Infra phase — see docs/PROGRESS.md).
