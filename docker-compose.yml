services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testgen}
      POSTGRES_USER: ${POSTGRES_USER:-testgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testgen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

# api / worker / ui services are added once their Dockerfiles exist (see docs/PROGRESS.md).
# A milvus standalone service is added in the Knowledge/RAG phase if milvus-lite proves
# unavailable on Windows (it has historically shipped Linux/macOS wheels only).
